name: Сборка Vensera-База знаний (Android)

# Собирается вместе с Windows/Mac при публикации релиза; вручную — кнопкой «Run workflow»
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Проверка ключа подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Не задан секрет ANDROID_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions). Без него приложение нельзя будет обновлять."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/venser.jks"

      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/venser.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VENSER_VERSION: ${{ github.event_name == 'release' && github.ref_name || '1.0.0' }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk VENSER-Android.apk
          V="${VENSER_VERSION#v}"; IFS=. read -r A B C <<< "$V"; C="${C%%[^0-9]*}"
          CODE=$(( ${A:-0}*10000 + ${B:-0}*100 + ${C:-0} ))
          printf '{"versionName":"%s","versionCode":%d,"url":"https://github.com/%s/releases/latest/download/VENSER-Android.apk"}\n' "$V" "$CODE" "$GITHUB_REPOSITORY" > android-version.json
          cat android-version.json

      - name: Загрузка в релиз
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" VENSER-Android.apk android-version.json --clobber

      - name: Сохранить файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: VENSER-Android
          path: VENSER-Android.apk
